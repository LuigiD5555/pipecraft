name: One-shot rustfmt external-work contract

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/format-external-work-once.yml'

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all
      - name: Commit rustfmt output
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/pipecraft-service/src/protocol.rs crates/pipecraft-service/src/server.rs
          git diff --cached --quiet && exit 0
          git commit -m 'style: rustfmt external-work transport contract'
          git push origin HEAD:main
