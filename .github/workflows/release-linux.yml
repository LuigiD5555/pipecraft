name: PipeCraft Linux release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  linux-x86_64:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Require complete Rust source
        run: |
          set -euo pipefail
          test -f Cargo.toml
          test -d crates
          test -f scripts/check_release_sources.py
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Verify source structure
        run: python3 scripts/check_release_sources.py
      - name: Generate and verify lockfile
        run: |
          set -euo pipefail
          cargo generate-lockfile
          test -s Cargo.lock
      - name: Rust format
        run: cargo fmt --all -- --check
      - name: Rust tests
        run: cargo test --locked --workspace --all-targets
      - name: Rust clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Build release binary
        run: cargo build --locked --release --workspace
      - name: Locate PipeCraft executable
        id: binary
        run: |
          set -euo pipefail
          candidate=""
          for path in target/release/pipecraft target/release/pipecraft-cli; do
            if [ -x "$path" ]; then candidate="$path"; break; fi
          done
          test -n "$candidate"
          cp "$candidate" pipecraft-linux-x86_64
          chmod 0755 pipecraft-linux-x86_64
          sha256sum pipecraft-linux-x86_64 > pipecraft-linux-x86_64.sha256
          ./pipecraft-linux-x86_64 --version
      - name: Upload CI artifact
        uses: actions/upload-artifact@v4
        with:
          name: pipecraft-linux-x86_64
          path: |
            pipecraft-linux-x86_64
            pipecraft-linux-x86_64.sha256
      - name: Publish GitHub release asset
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" --title "$tag" --generate-notes
          gh release upload "$tag" pipecraft-linux-x86_64 pipecraft-linux-x86_64.sha256 --clobber
