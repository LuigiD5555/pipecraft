name: PipeCraft Linux release

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths:
      - '.github/workflows/release-linux.yml'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'crates/**'
      - 'scripts/check_release_sources.py'
      - 'SOURCE_MANIFEST.sha256'
      - 'examples/10-external-admission/snapshot.json'

permissions:
  contents: write

concurrency:
  group: pipecraft-linux-release
  cancel-in-progress: false

jobs:
  linux-x86_64:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require complete Rust source
        run: |
          set -euo pipefail
          test -f Cargo.toml
          test -d crates
          test -f scripts/check_release_sources.py
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Verify source structure
        run: python3 scripts/check_release_sources.py
      - name: Verify committed lockfile
        run: |
          set -euo pipefail
          test -s Cargo.lock
          cargo metadata --locked --format-version 1 >/dev/null
      - name: Rust format
        run: cargo fmt --all -- --check
      - name: Rust tests
        run: cargo test --locked --workspace --all-targets
      - name: Rust clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Build release binary
        run: cargo build --locked --release --workspace
      - name: Locate PipeCraft executable
        run: |
          set -euo pipefail
          candidate=""
          for path in target/release/pipecraft target/release/pipecraft-cli; do
            if [ -x "$path" ]; then candidate="$path"; break; fi
          done
          test -n "$candidate"
          cp "$candidate" pipecraft-linux-x86_64
          chmod 0755 pipecraft-linux-x86_64
          sha256sum pipecraft-linux-x86_64 > pipecraft-linux-x86_64.sha256
          ./pipecraft-linux-x86_64 --version
      - name: Upload CI artifact
        uses: actions/upload-artifact@v4
        with:
          name: pipecraft-linux-x86_64
          path: |
            pipecraft-linux-x86_64
            pipecraft-linux-x86_64.sha256
      - name: Publish verified GitHub release
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            tag="$GITHUB_REF_NAME"
          else
            tag="v1.7.0-alpha.1"
          fi
          target="$(git rev-parse HEAD)"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "release $tag already exists; refusing to silently retarget it"
            exit 1
          fi
          gh release create "$tag" --target "$target" --title "$tag" --generate-notes \
            pipecraft-linux-x86_64 pipecraft-linux-x86_64.sha256
