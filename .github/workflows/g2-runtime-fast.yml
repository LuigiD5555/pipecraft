name: G2 runtime fast gate

on:
  push:
    branches: [main]
    paths:
      - 'crates/pipecraft-runtime/src/admission.rs'
      - 'crates/pipecraft-runtime/src/resources.rs'
      - 'crates/pipecraft-runtime/src/coordinator.rs'
      - 'crates/pipecraft-runtime/src/manager.rs'
      - 'crates/pipecraft-runtime/src/capacity.rs'
      - 'crates/pipecraft-runtime/src/scheduler.rs'
      - 'crates/pipecraft-runtime/tests/admission_gate.rs'
      - 'crates/pipecraft-runtime/tests/extracta_capacity_parity.rs'
      - 'tests/golden/extracta-capacity-v1.json'
      - 'crates/pipecraft-service/src/store.rs'
      - 'crates/pipecraft-service/src/server.rs'
      - '.github/workflows/g2-runtime-fast.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: g2-runtime-fast-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runtime-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: pipecraft-rust-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            pipecraft-rust-${{ runner.os }}-
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Runtime admission, resource and public gate tests
        run: timeout 240s cargo test --locked -p pipecraft-runtime --all-targets -- --test-threads=1 --nocapture
      - name: Service recovery hook tests
        run: timeout 240s cargo test --locked -p pipecraft-service --lib -- --test-threads=1 --nocapture
